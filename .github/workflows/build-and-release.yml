name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Sync version from tag into Info.plist and env
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Expected a stable tag in the form vX.Y.Z"
          exit 1
        fi
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        echo "DMG_VERSION=v$VERSION" >> $GITHUB_ENV

        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
        PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)

        echo "Tag version: $VERSION"
        echo "Info.plist version after sync: $PLIST_VERSION"

        if [ "$PLIST_VERSION" != "$VERSION" ]; then
          echo "Version mismatch after sync (expected $VERSION, got $PLIST_VERSION)"
          exit 1
        fi

    - name: Derive version from Info.plist (manual runs)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: |
        VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        echo "DMG_VERSION=v$VERSION" >> $GITHUB_ENV
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build Release
      run: |
        chmod +x Scripts/build_release.sh
        ./Scripts/build_release.sh

    - name: Run regression tests
      run: ./Scripts/test.sh
        
    - name: Create DMG
      run: |
        chmod +x Scripts/create_dmg.sh
        ./Scripts/create_dmg.sh
        
    - name: Upload DMG
      uses: actions/upload-artifact@v7
      with:
        name: AudioKeeper-DMG
        path: "*.dmg"
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: "*.dmg"
        fail_on_unmatched_files: true
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Homebrew Formula
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # Extract version from tag (remove 'v' prefix)
        VERSION=${GITHUB_REF#refs/tags/v}

        # Wait a bit for release to be fully published
        sleep 30

        # Calculate SHA256 of the DMG file
        DMG_SHA256=$(shasum -a 256 *.dmg | cut -d' ' -f1)

        # Version sync is build-local; do not carry the modified plist onto main.
        git restore Info.plist

        # Checkout main branch
        git fetch origin main
        git checkout main

        # Update the formula file
        sed -i '' "s/version \"[^\"]*\"/version \"${VERSION}\"/" audiokeeper.rb
        sed -i '' "s/sha256 \"[^\"]*\"/sha256 \"${DMG_SHA256}\"/" audiokeeper.rb

        # Commit and push changes
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add audiokeeper.rb
        git diff --staged --quiet || git commit -m "chore: Auto-update Homebrew formula to v${VERSION}"
        git push origin main
